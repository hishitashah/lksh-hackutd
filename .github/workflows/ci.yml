# CI for Avon Nightwatch (task T0.5). Runs on every push and pull request to main.
# Once branch protection is on (GitHub: Settings > Branches > protect main > require these checks),
# a red check blocks the merge. Run the same checks locally with `make lint test branding`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Python: lint, format check, and tests (contract + API). The scorer joins in T1.3.
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (exact versions from uv.lock)
        run: uv sync --frozen
      - name: Lint + format check
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      # T1.3: add the scorer here so a PR fails if detection or plan accuracy drops, e.g.
      # - name: Scorer
      #   run: uv run python scripts/score.py ../history/full_week

  # Frontend: generated types are current, then typecheck + build, then lint.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (needed to export the API spec)
        run: cd backend && uv sync --frozen
      - name: Install frontend (exact versions from package-lock.json)
        run: cd frontend && npm ci
      - name: Generated API types are up to date (run `make types` and commit if this fails)
        run: make types && git diff --exit-code frontend/src/api
      - name: Typecheck + build
        run: cd frontend && npm run build
      - name: Lint
        run: cd frontend && npm run lint

  # Team branding rules from CLAUDE.md (no banned font, no Avon Corps footer).
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Branding check
        run: ./scripts/check_branding.sh
