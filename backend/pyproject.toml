# Backend project for Avon Nightwatch (see plan.md "Architecture & stack").
# Managed with uv: `uv sync` installs everything, `uv add <pkg>` adds a dependency.
# All dependencies the plan needs are added up front (M0, T0.1) so four people
# working in parallel don't keep changing uv.lock.

[project]
name = "nightwatch"
version = "0.1.0"
description = "Avon Nightwatch backend: data loading, detection, planning, Sentinel agent and the API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langgraph>=1.2.20",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "scipy>=1.18.1",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

# Package layout: the importable code lives in backend/nightwatch/.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightwatch"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# Dev tools (installed by `uv sync`; not shipped with the app).
# pytest runs backend/tests, ruff lints and checks import order.

# Linting: `uv run ruff check .` (run by `make lint` and CI).
[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
# E/F = errors and pyflakes, I = import order, B = common bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

# Tests: `uv run pytest` (run by `make test` and CI). Tests live in backend/tests.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import `nightwatch` straight from backend/ without reinstalling the package.
pythonpath = ["."]
