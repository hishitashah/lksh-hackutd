<!doctype html>
<!--
  Entry page for the Avon Nightwatch frontend. Vite injects the app bundle (src/main.tsx).
  The "dark" class turns on the dark theme defined in src/index.css (the console is dark by design).
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Avon Nightwatch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
